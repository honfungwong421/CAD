<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Master</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Navigation -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-graduation-cap mr-2"></i>MCQ Master</h1>
            <div class="space-x-4">
                <button onclick="app.navigate('home')" class="hover:text-blue-200 transition">Banks</button>
                <button onclick="app.navigate('import')" class="hover:text-blue-200 transition">Import</button>
                <button onclick="app.navigate('debug')" class="text-xs bg-red-500 px-2 py-1 rounded hover:bg-red-600 transition">Helper</button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container mx-auto px-4 py-6" id="app-container">
        <!-- Views will be injected here -->
    </main>

    <!-- Templates -->
    <template id="view-home">
        <div class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-700">Question Banks</h2>
                <div class="space-x-2">
                    <button onclick="app.navigate('import')" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow">
                        <i class="fas fa-plus mr-2"></i>New Bank
                    </button>
                </div>
            </div>
            
            <!-- Added Search and Sort Controls -->
            <div class="flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-4 bg-white p-4 rounded-lg shadow">
                <div class="flex-1">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-gray-400"></i>
                        </div>
                        <input type="text" id="search-input" oninput="app.filterBanks(this.value)" placeholder="Search banks..." class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <select id="sort-select" onchange="app.sortBanks(this.value)" class="w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="name_asc">Name (A-Z)</option>
                        <option value="name_desc">Name (Z-A)</option>
                    </select>
                </div>
            </div>

            <div id="bank-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Banks injected here -->
            </div>
            
            <div id="empty-state" class="hidden text-center py-12 bg-white rounded-lg shadow">
                <i class="fas fa-folder-open text-gray-300 text-5xl mb-4"></i>
                <p class="text-gray-500">No question banks found. Import a PDF to get started!</p>
            </div>
        </div>

    <template id="view-import">
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-gray-700">Import Questions</h2>
            
            <div class="space-y-6">
                <!-- PDF Import -->
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition cursor-pointer" onclick="document.getElementById('pdf-upload').click()">
                    <i class="fas fa-file-pdf text-red-500 text-4xl mb-3"></i>
                    <h3 class="font-semibold text-lg">Upload PDF</h3>
                    <p class="text-gray-500 text-sm">Extract questions automatically</p>
                    <input type="file" id="pdf-upload" class="hidden" accept="application/pdf" onchange="app.handlePdfUpload(this)">
                </div>

                <!-- JSON Import -->
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-green-500 transition cursor-pointer" onclick="document.getElementById('json-upload').click()">
                    <i class="fas fa-file-code text-green-500 text-4xl mb-3"></i>
                    <h3 class="font-semibold text-lg">Upload JSON</h3>
                    <p class="text-gray-500 text-sm">Import exported question bank</p>
                    <input type="file" id="json-upload" class="hidden" accept=".json" onchange="app.handleJsonUpload(this)">

            </div>

            <div id="import-status" class="mt-6 hidden">
                <div class="flex items-center justify-center space-x-3 text-blue-600">
                    <div class="loader"></div>

                </div>

            <div id="import-error" class="mt-6 hidden bg-red-50 border-l-4 border-red-500 p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-exclamation-circle text-red-500"></i>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">Something went wrong</h3>
                        <div class="mt-2 text-sm text-red-700" id="error-message"></div>

                <div class="space-x-2">

                        <i class="fas fa-save mr-2"></i>Save & Exit

            <div id="questions-editor" class="space-y-6">

            <button onclick="app.addEmptyQuestion()" class="w-full py-3 border-2 border-dashed border-gray-300 text-gray-500 font-semibold rounded-lg hover:bg-gray-50 hover:border-gray-400 transition">

            <button id="btn-generate-ai" onclick="app.generateAIQuestions()" class="w-full mt-4 py-3 border-2 border-dashed border-purple-300 bg-purple-50 text-purple-700 font-semibold rounded-lg hover:bg-purple-100 transition flex items-center justify-center">

    <template id="view-practice-setup">
        <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
            <h2 class="text-2xl font-bold mb-1 text-gray-700 text-center">Practice Setup</h2>
            <p id="setup-bank-date" class="text-xs text-gray-500 text-center mb-6"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Mode</label>
                    <div class="flex space-x-2">
                        <button id="mode-std" onclick="app.setPracticeMode('standard')" class="flex-1 py-2 px-4 rounded border-2 border-blue-500 bg-blue-500 text-white">Standard</button>
                        <button id="mode-rds" onclick="app.setPracticeMode('rds')" class="flex-1 py-2 px-4 rounded border-2 border-gray-300 text-gray-600 hover:border-purple-500">Real Dope Shit</button>
                    </div>

                </div>

                    <div class="flex items-center space-x-4">
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 mb-1">Start From Question</label>
                            <input type="number" id="practice-start" class="w-full border rounded px-3 py-2 text-center" min="1">
                        </div>
                        <div class="text-gray-400 font-medium mt-4">to</div>
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 mb-1">End On Question</label>
                            <input type="number" id="practice-end" class="w-full border rounded px-3 py-2 text-center" min="1">
                        </div>
                    </div>
                    <p id="range-desc" class="text-xs text-blue-600 font-medium mt-2 text-center"></p>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="practice-shuffle" class="mr-2 h-5 w-5 text-blue-600">
                    <label for="practice-shuffle" class="text-gray-700">Shuffle Questions</label>
                </div>

                <button onclick="app.startPractice()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded mt-4 shadow transition">
                    Start Practice
                </button>
                
                 <div id="resume-container" class="hidden border-t pt-4 mt-4">
                     <button id="resume-btn" onclick="app.resumePractice()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded shadow transition">
                        Resume Saved Session
                    </button>
                 </div>
            </div>
        </div>
    </template>

    <template id="view-practice">
        <div class="max-w-3xl mx-auto space-y-6">
            <!-- Header -->
            <div class="bg-white p-4 rounded-lg shadow flex justify-between items-center sticky top-0 z-10">
                <div class="text-lg font-bold">
                    Question <span id="p-current">1</span>/<span id="p-total">10</span>

                    <div class="mb-3">

                    </div>
                    <div class="flex justify-end space-x-2 mt-4">

                        <button onclick="app.saveQuickEdit()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium">Save Changes</button>
                    </div>
                </div>

                <div id="p-question-text" class="text-lg font-medium mb-4 text-gray-800 leading-relaxed"></div>
                <div id="p-question-image" class="mb-4 hidden">

            <!-- Controls -->

                <p class="text-gray-600 mb-6" id="result-detail">You got 8 out of 10 correct.</p>
                <button onclick="app.navigate('home')" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-bold shadow">Back to Home</button>
            </div>
            
            <div id="wrong-answers-section">
                <h3 class="text-xl font-bold text-gray-700 mb-4">Review Incorrect Answers</h3>

    <template id="view-debug">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-gray-700"><i class="fas fa-bug mr-2 text-red-500"></i>Helper / Debugger</h2>
            
            <!-- External API Key Config -->
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 mb-6 hover:border-blue-500 transition">
                <h3 class="font-semibold text-lg mb-2"><i class="fas fa-key text-blue-500 mr-2"></i>External API Key</h3>
                <p class="text-gray-500 text-sm mb-4">If you are using this tool outside the original platform, enter your Google Gemini API Key below to enable AI features.</p>
                <div class="flex space-x-2">
                    <input type="password" id="user-api-key" placeholder="Enter Gemini API Key..." class="flex-1 border border-gray-300 rounded px-3 py-2">
                    <button onclick="app.saveApiKey()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium">Save Key</button>
                </div>
                <p id="api-key-status" class="text-xs mt-2 text-green-600 hidden">Key saved securely to your browser.</p>
            </div>

            <p class="mb-6 text-gray-600">If your PDF isn't importing correctly, upload it here. We'll examine it and tell you exactly what the computer sees.</p>
            
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-red-500 transition cursor-pointer mb-6" onclick="document.getElementById('debug-upload').click()">
                <i class="fas fa-microscope text-red-500 text-4xl mb-3"></i>
                <h3 class="font-semibold text-lg">Inspect PDF</h3>
                <input type="file" id="debug-upload" class="hidden" accept="application/pdf" onchange="app.runDebug(this)">
            </div>

            <div id="debug-output" class="hidden space-y-6">
                <div class="bg-blue-50 p-4 rounded border-l-4 border-blue-500">
                    <h3 class="font-bold text-blue-700">Analysis Report</h3>
                    <ul class="list-disc list-inside mt-2 text-sm text-blue-800 space-y-1" id="debug-report-list">
                    </ul>
                </div>
                
                <div>
                    <h3 class="font-bold text-gray-700 mb-2">Raw Text Lines Detected:</h3>
                    <div class="bg-gray-800 text-green-400 p-4 rounded font-mono text-xs h-64 overflow-y-auto" id="debug-log">
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        // Main Application Logic
        const app = {
            data: {
                banks: [],
                currentBankIndex: null,
                tempBank: null, // For editing
                practiceSession: null,
                searchQuery: "",
                sortBy: "newest"
            },
            
            // --- AI Features ---
            async callGemini(prompt, systemInstruction = null, jsonSchema = null) {
                const apiKey = ""; // API Key provided by environment
                let activeKey = apiKey || localStorage.getItem('mcq_user_api_key');
                
                if (!activeKey) {
                    throw new Error("API_KEY_MISSING");
                }

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${activeKey}`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }]
                };

                if (systemInstruction) {
                    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                }

                if (jsonSchema) {
                    payload.generationConfig = {
                        responseMimeType: "application/json",
                        responseSchema: jsonSchema
                    };
                }

                // Exponential backoff
                const delays = [1000, 2000, 4000, 8000, 16000];
                for (let i = 0; i < delays.length + 1; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        
                        if (!response.ok) {
                            if (response.status === 400 && !apiKey) throw new Error("API_KEY_INVALID");
                            throw new Error(`HTTP Error: ${response.status}`);
                        }
                        const result = await response.json();
                        return result.candidates[0].content.parts[0].text;
                    } catch (error) {
                        if (i === delays.length) {
                            console.error("AI service failed after retries:", error);
                            return null;
                        }
                        await new Promise(res => setTimeout(res, delays[i]));
                    }
                }
            },

            async generateAIQuestions() {
                const btn = document.getElementById('btn-generate-ai');
                btn.innerHTML = `<div class="loader mr-2" style="width: 20px; height: 20px; border-width: 3px;"></div> Generating...`;
                btn.disabled = true;

                try {
                    let context = "Create multiple choice questions.";
                    const existingCount = this.data.tempBank.questions.length;
                    
                    if (existingCount > 0) {
                        // Pass up to 3 existing questions as context
                        const samples = this.data.tempBank.questions.slice(-3).map(q => q.text).join(" | ");
                        context = `Based on the style and topic of these existing questions: "${samples}", generate 3 more relevant multiple choice questions.`;
                    } else {
                        const topic = prompt("What topic should the AI generate questions about?");
                        if (!topic) throw new Error("Canceled");
                        context = `Generate 3 multiple choice questions about: ${topic}.`;
                    }

                    const schema = {
                        type: "OBJECT",
                        properties: {
                            questions: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        text: { type: "STRING" },
                                        choices: { type: "ARRAY", items: { type: "STRING" } },
                                        correctIndex: { type: "INTEGER" }
                                    },
                                    required: ["text", "choices", "correctIndex"]
                                }
                            }
                        },
                        required: ["questions"]
                    };

                    const result = await this.callGemini(context, "You are a helpful educational assistant generating high quality multiple choice questions.", schema);
                    
                    if (result) {
                        const parsed = JSON.parse(result);
                        if (parsed.questions && parsed.questions.length > 0) {
                            parsed.questions.forEach(q => {
                                q.id = Date.now() + Math.random();
                                this.data.tempBank.questions.push(q);
                            });
                            this.renderEdit();
                            setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 100);
                        }
                    } else {
                        alert("Failed to generate questions. Please try again.");
                    }
                } catch (err) {
                    if (err.message === "API_KEY_MISSING" || err.message === "API_KEY_INVALID") {
                        alert("Please go to the 'Helper' tab and set a valid Gemini API Key to use this feature externally.");
                    } else if (err.message !== "Canceled") {
                        alert("Error: " + err.message);
                    }
                } finally {
                    btn.innerHTML = `✨ Generate AI Questions`;
                    btn.disabled = false;
                }
            },

            async explainPracticeAnswer(btnElement) {
                const session = this.data.practiceSession;
                const q = session.questions[session.currentIndex];
                const userAnswerIdx = session.answers[session.currentIndex];
                
                const explanationDiv = document.getElementById('p-ai-explanation');
                btnElement.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> Thinking...`;
                btnElement.disabled = true;

                const promptText = `
                    I am answering a multiple choice question: "${q.text}"
                    The choices are: ${JSON.stringify(q.choices)}
                    The correct answer is index ${q.correctIndex} ("${q.choices[q.correctIndex]}").
                    I chose index ${userAnswerIdx} ("${q.choices[userAnswerIdx]}").
                    Briefly explain why the correct answer is correct, and clarify why my answer is wrong (if it is). Keep it encouraging and concise.
                `;

                try {
                    const result = await this.callGemini(promptText);
                    
                    if (result) {
                        explanationDiv.classList.remove('hidden');
                        explanationDiv.innerText = result;
                        btnElement.style.display = 'none'; // Hide button once explained
                    } else {
                        throw new Error("No response");
                    }
                } catch (err) {
                    btnElement.innerHTML = `✨ Try Again`;
                    btnElement.disabled = false;
                    if (err.message === "API_KEY_MISSING" || err.message === "API_KEY_INVALID") {
                        alert("Please go to the 'Helper' tab and set your Gemini API Key to use AI features externally.");
                    }
                }
            },

            async explainResultAnswer(qIndex, btnElement) {
                const session = this.data.practiceSession;
                const q = session.questions[qIndex];
                const userAnswerIdx = session.answers[qIndex];
                
                const explanationDiv = btnElement.nextElementSibling;
                btnElement.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> Thinking...`;
                btnElement.disabled = true;

                let userChoiceText = userAnswerIdx !== undefined && q.choices[userAnswerIdx] ? q.choices[userAnswerIdx] : "None";

                const promptText = `
                    Reviewing a multiple choice question: "${q.text}"
                    Choices: ${JSON.stringify(q.choices)}
                    Correct answer: "${q.choices[q.correctIndex]}".
                    User chose: "${userChoiceText}".
                    Explain concisely why the correct answer is right and why the user's choice is wrong.
                `;

                try {
                    const result = await this.callGemini(promptText);
                    
                    if (result) {
                        explanationDiv.classList.remove('hidden');
                        explanationDiv.innerText = result;
                        btnElement.style.display = 'none';
                    } else {
                        throw new Error("No response");
                    }
                } catch (err) {
                    btnElement.innerHTML = `✨ Try Again`;
                    btnElement.disabled = false;
                    if (err.message === "API_KEY_MISSING" || err.message === "API_KEY_INVALID") {
                        alert("Please go to the 'Helper' tab and set your Gemini API Key to use AI features externally.");
                    }
                }
            },

            init() {
                this.loadBanks();
                this.navigate('home');
                
                // Auto-sync from user's GitHub repository
                this.fetchExternalBanks();
            },
            
            filterBanks(query) {
                this.data.searchQuery = query.toLowerCase();
                this.renderHome();
            },

            sortBanks(sortValue) {
                this.data.sortBy = sortValue;
                this.renderHome();
            },

            formatDate(isoString) {
                if (!isoString) return 'Unknown Date';
                const date = new Date(isoString);
                return isNaN(date.getTime()) ? 'Unknown Date' : date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            },

            async fetchExternalBanks() {
                const apiURL = "https://api.github.com/repos/honfungwong421/CAD/contents/bank";
                // Get manifest from localStorage to track already synced versions
                let manifest = JSON.parse(localStorage.getItem('mcq_sync_manifest') || '{}');
                
                try {
                    const response = await fetch(apiURL);
                    if (!response.ok) return;
                    const files = await response.json();
                    
                    let changesMade = false;
                    for (const file of files) {
                        if (file.name.endsWith('.json') && file.download_url) {
                            const bankName = file.name.replace('.json', '');
                            const remoteSha = file.sha; // Unique ID for file version
                            
                            // Check if we already have this exact version
                            if (manifest[bankName] === remoteSha) {
                                continue;
                            }

                            const contentResponse = await fetch(file.download_url);
                            if (contentResponse.ok) {
                                try {
                                    const bank = await contentResponse.json();
                                    if (bank.questions && Array.isArray(bank.questions)) {
                                        if (!bank.name) bank.name = bankName;
                                        if (!bank.date) bank.date = new Date().toISOString();
                                        bank.questions.forEach(q => { if (!q.id) q.id = Date.now() + Math.random(); });
                                        
                                        // Update if exists, or Add if new
                                        const existingIndex = this.data.banks.findIndex(b => b.name === bankName);
                                        if (existingIndex > -1) {
                                            this.data.banks[existingIndex] = bank;
                                        } else {
                                            this.data.banks.push(bank);
                                        }
                                        
                                        // Update manifest with new version ID
                                        manifest[bankName] = remoteSha;
                                        changesMade = true;
                                    }
                                } catch (err) {
                                    console.error("Invalid JSON content in " + file.name);
                                }
                            }
                        }
                    }
                    
                    if (changesMade) {
                        this.saveBanks();
                        localStorage.setItem('mcq_sync_manifest', JSON.stringify(manifest));
                        // Re-render if viewing the banks list
                        if (document.getElementById('bank-list')) {
                            this.navigate('home'); 
                        }
                    }
                } catch (e) {
                    console.error("Failed to sync from GitHub:", e);
                }
            },

            loadBanks() {
                const saved = localStorage.getItem('mcq_banks');
                if (saved) {
                    this.data.banks = JSON.parse(saved);
                }
            },

            saveBanks() {
                localStorage.setItem('mcq_banks', JSON.stringify(this.data.banks));
            },

            async runDebug(input) {
                const file = input.files[0];
                if (!file) return;
                
                const output = document.getElementById('debug-output');
                const log = document.getElementById('debug-log');
                const reportList = document.getElementById('debug-report-list');
                
                output.classList.remove('hidden');
                log.innerHTML = "Reading file...";
                reportList.innerHTML = "";
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    
                    log.innerHTML = `PDF Loaded. Pages: ${pdf.numPages}\n------------------\n`;
                    
                    // We reuse the logic but instrument it
                    let totalLines = 0;
                    let potentialQuestions = 0;
                    let potentialChoices = 0;
                    let markersFound = 0;
                    let boldLines = 0;
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        
                        const lines = {};
                        content.items.forEach(item => {
                            const y = Math.round(item.transform[5]);
                            if (!lines[y]) lines[y] = [];
                            lines[y].push({
                                text: item.str,
                                x: item.transform[4],
                                hasMark: item.str.includes('*'),
                                isBold: item.fontName.toLowerCase().includes('bold')
                            });
                        });
                        
                        const sortedY = Object.keys(lines).sort((a, b) => b - a);
                        
                        sortedY.forEach(y => {
                            lines[y].sort((a, b) => a.x - b.x);
                            const lineText = lines[y].map(item => item.text).join(' ').trim();
                            const hasMark = lines[y].some(item => item.hasMark);
                            const boldCount = lines[y].filter(i => i.isBold).length;
                            const isLineBold = lines[y].length > 0 && (boldCount / lines[y].length) > 0.5;
                            
                            if (lineText) {
                                totalLines++;
                                let note = "";
                                if (/^(\d+)[\.\)](.+)/.test(lineText)) { potentialQuestions++; note += " [Possible Question]"; }
                                if (/^(\(?[a-zA-Z]\)|[a-zA-Z]\.)(.+)/.test(lineText)) { potentialChoices++; note += " [Possible Choice]"; }
                                if (hasMark) { markersFound++; note += " [Marker Found *]"; }
                                if (isLineBold) { boldLines++; note += " [BOLD]"; }
                                
                                log.innerHTML += `Line ${totalLines}: ${lineText} ${note}\n`;
                            }
                        });
                    }
                    
                    // Generate Report
                    const addReport = (msg, isBad = false) => {
                        const li = document.createElement('li');
                        li.innerText = msg;
                        if(isBad) li.className = "text-red-600 font-bold";
                        reportList.appendChild(li);
                    };
                    
                    addReport(`Total text lines found: ${totalLines}`);
                    addReport(`Lines starting with numbers (Possible Questions): ${potentialQuestions}`);
                    addReport(`Lines looking like choices (a., b., etc.): ${potentialChoices}`);
                    
                    if (totalLines === 0) {
                        addReport("CRITICAL: No text found. This file is likely an image (scanned) or encrypted. We cannot read it.", true);
                    } else if (potentialQuestions === 0) {
                        addReport("CRITICAL: We found text, but no lines started with '1.' or '2)'. Please number your questions.", true);
                    } else if (potentialChoices === 0) {
                         addReport("WARNING: We found questions but no choices like 'a.' or '(b)'.", true);
                    } else {
                        addReport("GOOD: The file structure looks readable.");
                        if (markersFound === 0 && boldLines === 0) {
                            addReport("TIP: We didn't see any '*' markers or bold text. You might need to set correct answers manually.", true);
                        } else {
                            addReport(`We found ${markersFound} '*' markers and ${boldLines} bold lines to identify correct answers.`);
                        }
                    }
                    
                } catch (e) {
                    log.innerHTML += `\nERROR: ${e.message}`;
                    reportList.innerHTML = `<li class="text-red-600 font-bold">Fatal Error: ${e.message}</li>`;
                }
            },

            // --- PDF Parsing Logic ---
            async parsePdf(pdf) {
                const questions = [];
                let currentQuestion = null;
                let buffer = [];
                let textLines = [];

                // 1. Extract and sort text
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const lines = {}; 
                    content.items.forEach(item => {
                        const y = Math.round(item.transform[5]); 
                        if (!lines[y]) lines[y] = [];
                        lines[y].push({
                            text: item.str,
                            x: item.transform[4],
                            hasMark: item.str.includes('*'), 
                            isBold: item.fontName.toLowerCase().includes('bold')
                        });
                    });
                    const sortedY = Object.keys(lines).sort((a, b) => b - a);
                    sortedY.forEach(y => {
                        lines[y].sort((a, b) => a.x - b.x);
                        const lineText = lines[y].map(item => item.text).join(' ').trim();
                        const hasMark = lines[y].some(item => item.hasMark);
                        const boldCount = lines[y].filter(i => i.isBold).length;
                        const isLineBold = lines[y].length > 0 && (boldCount / lines[y].length) > 0.5;
                        if (lineText) textLines.push({ text: lineText, hasMark: hasMark, isBold: isLineBold });
                    });
                }

                // Helper to save current question
                const saveCurrent = () => {
                    if (currentQuestion && currentQuestion.choices.length > 0) {
                        // Basic cleanup of text
                        currentQuestion.text = currentQuestion.text.trim();
                        if (currentQuestion.correctIndex === -1) currentQuestion.correctIndex = 0;
                        questions.push(currentQuestion);
                    }
                    currentQuestion = null;
                };

                // Regex for choices (starts with a. or (a) or i.)
                const reChoice = /^(\(?[a-zA-Z]\)|[a-zA-Z]\.|^\(?[ivxIVX]+\))(.+)/;
                // Regex to check if choice is a 'starter' like 'a.' or '(a)' or 'i.'
                const isStartChoice = (str) => /^\(?[ai]\)?[.\s]/i.test(str);

                for (let i = 0; i < textLines.length; i++) {
                    let lineObj = textLines[i];
                    let text = lineObj.text.trim();
                    let isCorrectMarker = lineObj.hasMark || lineObj.isBold;
                    
                    // Clean text if it has the * mark
                    let cleanText = text.replace(/\*/g, '').trim();

                    const matchChoice = cleanText.match(reChoice);
                    const isLowercase = /^[a-z]/.test(text); // Check original for lowercase start

                    if (matchChoice) {
                        // This is a CHOICE
                        const choiceText = matchChoice[2].trim();
                        const choiceMarker = matchChoice[1];

                        // Rule: If it's a "start" choice (a., i.), create new question from buffer
                        if (isStartChoice(choiceMarker)) {
                            saveCurrent();
                            
                            // The sentence above choice 'a' is the question.
                            // We use the buffer collected so far.
                            let qText = buffer.join(' ').trim();
                            if (!qText) qText = "Question Text Missing";

                            currentQuestion = {
                                id: Date.now() + Math.random(),
                                text: qText,
                                choices: [],
                                correctIndex: -1
                            };
                            buffer = []; // Clear buffer for next cycle
                        }

                        if (currentQuestion) {
                            currentQuestion.choices.push(choiceText);
                            if (isCorrectMarker) {
                                currentQuestion.correctIndex = currentQuestion.choices.length - 1;
                            }
                        }
                    } else {
                        // This is NOT a choice
                        
                        // Rule: Ignore lowercase remarks/references
                        if (isLowercase) {
                            // Exception: if we are in the middle of a question text (no choices yet), 
                            // maybe it's just a long sentence? 
                            // But user said: "don't put the reference or remark into the choice or question"
                            // and "sentance above option a is the question".
                            // Usually, unnumbered questions are single sentences or clearly uppercase starters.
                            continue; 
                        }

                        // If we are currently collecting choices and hit a non-choice line, 
                        // it means the question is over.
                        if (currentQuestion && currentQuestion.choices.length > 0) {
                            saveCurrent();
                        }

                        // Add to buffer (potential question text)
                        buffer.push(text);
                        
                        // If buffer gets too large without a choice 'a', keep only the last few lines
                        // to ensure "the sentence above choice a" is accurate.
                        if (buffer.length > 10) buffer.shift();
                    }
                }

                saveCurrent();
                return questions;
            },

                if(this.data.tempBank.questions[qIndex].correctIndex === cIndex) {
                    this.data.tempBank.questions[qIndex].correctIndex = -1;
                } else if (this.data.tempBank.questions[qIndex].correctIndex > cIndex) {
                    this.data.tempBank.questions[qIndex].correctIndex--;
                }
                this.renderEdit();
            },

                this.data.tempBank.questions.push({ 
                    id: Date.now() + Math.random(),

                    choices: ["Option A", "Option B"],

                });

            },

            uploadImage(qIndex, input) {

            saveBankEdit() {
                this.data.banks[this.data.currentBankIndex] = this.data.tempBank;
                this.saveBanks();
                
                const wasReturning = this.data.returnToPractice;
                this.data.tempBank = null; // Fix: Clear temporary bank so exit confirmation doesn't trigger
                
                if (wasReturning) {
                    delete this.data.returnToPractice;
                    // Update the practice session questions with the edited data
                    if (this.data.practiceSession) {
                        this.data.practiceSession.questions = this.data.practiceSession.questions.map(sq => {
                            const updated = this.data.banks[this.data.currentBankIndex].questions.find(bq => bq.id === sq.id);
                            // Preserve original index when replacing edited question in active session
                            return updated ? JSON.parse(JSON.stringify({...updated, originalIndex: sq.originalIndex})) : sq;
                        });
                        this.saveSession();
                        this.navigate('practice');
                    } else {
                        this.navigate('home');
                    }
                } else {
                    this.navigate('home');
                }
            },

            editQuestionFromPractice() {
                this.data.returnToPractice = true;
                this.editBank(this.data.currentBankIndex);
            },

            // --- Practice Setup ---
            renderPracticeSetup() {
                const bank = this.data.banks[this.data.currentBankIndex];
                const startInput = document.getElementById('practice-start');
                const endInput = document.getElementById('practice-end');
                const desc = document.getElementById('range-desc');
                
                // Display Last Updated Date
                const dateEl = document.getElementById('setup-bank-date');
                if (dateEl) {
                    dateEl.innerText = 'Last Updated: ' + this.formatDate(bank.date);
                }

                // Establish defaults for the question range
                startInput.value = 1;
                startInput.max = bank.questions.length;
                endInput.value = bank.questions.length;
                endInput.max = bank.questions.length;

                // Bind listener to show dynamic count
                const updateDesc = () => {
                    let s = parseInt(startInput.value) || 1;
                    let e = parseInt(endInput.value) || bank.questions.length;
                    
                    // Constrain for visual logic only
                    s = Math.max(1, Math.min(s, bank.questions.length));
                    e = Math.max(1, Math.min(e, bank.questions.length));
                    
                    if (s > e) {
                        desc.innerHTML = '<span class="text-red-500">Start must be before End</span>';
                    } else {
                        desc.innerText = `You will practice ${e - s + 1} questions in this session.`;
                    }
                };
                
                startInput.addEventListener('input', updateDesc);
                endInput.addEventListener('input', updateDesc);
                updateDesc();

                // Resume check mechanism
                const saved = localStorage.getItem('mcq_practice_session');
                const resumeContainer = document.getElementById('resume-container');
                const resumeBtn = document.getElementById('resume-btn');
                resumeContainer.classList.add('hidden'); // hidden by default

                if (saved) {
                    try {
                        const session = JSON.parse(saved);
                        // Make sure the saved session is for the currently viewed Bank
                        if (session.bankName === bank.name && !session.finished) {
                            resumeContainer.classList.remove('hidden');
                            resumeBtn.innerText = `Resume Saved Session (Q${session.currentIndex + 1} of ${session.questions.length})`;
                        }
                    } catch (e) {
                        console.error("Could not parse saved session", e);
                    }
                }
            },

            setupPractice(index) {
                this.data.currentBankIndex = index;
                this.navigate('practice-setup');
            },

            setPracticeMode(mode) {
                const btnStd = document.getElementById('mode-std');
                const btnRds = document.getElementById('mode-rds');
                const desc = document.getElementById('mode-desc');
                
                if (mode === 'standard') {
                    btnStd.classList.add('bg-blue-500', 'text-white', 'border-blue-500');
                    btnStd.classList.remove('text-gray-600', 'border-gray-300');
                    btnRds.classList.remove('bg-purple-600', 'text-white', 'border-purple-600');
                    btnRds.classList.add('text-gray-600', 'border-gray-300');
                    desc.innerText = "Immediate feedback after every question.";
                } else {
                    btnRds.classList.add('bg-purple-600', 'text-white', 'border-purple-600');
                    btnRds.classList.remove('text-gray-600', 'border-gray-300');
                    btnStd.classList.remove('bg-blue-500', 'text-white', 'border-blue-500');
                    btnStd.classList.add('text-gray-600', 'border-gray-300');
                    desc.innerText = "Real Dope Shit Mode: No feedback until the end. Exam style.";
                }
                btnStd.dataset.selected = mode === 'standard';
            },

            startPractice() {
                const bank = this.data.banks[this.data.currentBankIndex];
                const isStd = document.getElementById('mode-std').dataset.selected !== 'false'; // Default true
                
                let startIdx = parseInt(document.getElementById('practice-start').value);
                if(isNaN(startIdx) || startIdx < 1) startIdx = 1;
                let endIdx = parseInt(document.getElementById('practice-end').value);
                if(isNaN(endIdx) || endIdx > bank.questions.length) endIdx = bank.questions.length;
                
                // Bounds logic
                startIdx = Math.max(1, Math.min(startIdx, bank.questions.length));
                endIdx = Math.max(startIdx, Math.min(endIdx, bank.questions.length));

                if (startIdx > endIdx) {
                    alert("The starting question number cannot be larger than the ending question number.");
                    return;
                }

                // Attach absolute index property to show later and then perform array slice
                let questions = bank.questions.map((q, idx) => {
                    return { ...q, originalIndex: idx + 1 };
                });
                
                questions = questions.slice(startIdx - 1, endIdx);

                const shuffle = document.getElementById('practice-shuffle').checked;
                if (shuffle) {
                    // Fix: Use Fisher-Yates shuffle to guarantee no duplicates
                    for (let i = questions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [questions[i], questions[j]] = [questions[j], questions[i]];
                    }
                }

                this.data.practiceSession = {
                    bankName: bank.name,
                    questions: questions,
                    currentIndex: 0,
                    score: 0,
                    mode: isStd ? 'standard' : 'rds',
                    answers: {}, // Store user answers
                    finished: false
                };

                this.saveSession(); // Always store state immediately
                this.navigate('practice');
            },
            
            resumePractice() {
                const saved = localStorage.getItem('mcq_practice_session');
                if (saved) {
                    this.data.practiceSession = JSON.parse(saved);
                    this.navigate('practice');
                }
            },

            saveSession() {
                // Background autosave functionality (runs on every question change/answer)
                localStorage.setItem('mcq_practice_session', JSON.stringify(this.data.practiceSession));
            },
            
            saveAndQuit() {
                // Ensure state is 100% saved before moving user explicitly back to home screen
                this.saveSession();
                this.navigate('home');
            },

            // --- Practice Render & Logic ---
            renderPractice() {
                const session = this.data.practiceSession;
                if (!session) return;
                
                // Ensure quick edit modal is hidden on re-render
                const qeContainer = document.getElementById('p-quick-edit-container');
                if (qeContainer) qeContainer.classList.add('hidden');
                
                // Update header
                document.getElementById('p-current').innerText = session.currentIndex + 1;
                document.getElementById('p-total').innerText = session.questions.length;
                
                // Score visibility
                if (session.mode === 'rds') {
                    document.getElementById('score-display').classList.add('hidden');
                } else {
                    document.getElementById('score-display').classList.remove('hidden');
                }

                // Render Question
                const q = session.questions[session.currentIndex];
                document.getElementById('p-score').innerText = session.score;
                
                // Add the specific "Bank Q15" marker if they sliced
                const originalIndexLabel = document.getElementById('p-original-index');
                if (q.originalIndex) {
                    originalIndexLabel.innerText = `(Bank Q${q.originalIndex})`;
                } else {
                    originalIndexLabel.innerText = '';
                }

                document.getElementById('p-question-text').innerText = q.text;
                
                const imgDiv = document.getElementById('p-question-image');
                if (q.image) {
                    imgDiv.classList.remove('hidden');
                    imgDiv.querySelector('img').src = q.image;
                } else {
                    imgDiv.classList.add('hidden');
                }

                // Render Choices
                const choicesDiv = document.getElementById('p-choices');
                choicesDiv.innerHTML = '';
                const feedbackDiv = document.getElementById('p-feedback');
                feedbackDiv.classList.add('hidden');
                feedbackDiv.className = 'mt-6 hidden p-4 rounded-lg'; // reset classes

                const userAnswer = session.answers[session.currentIndex];
                const isAnswered = userAnswer !== undefined;

                q.choices.forEach((c, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-3 rounded border border-gray-200 hover:bg-gray-50 transition flex items-start';
                    
                    // Styling based on state
                    if (isAnswered) {
                         if (session.mode === 'standard') {
                             if (idx === q.correctIndex) {
                                 btn.classList.add('bg-green-100', 'border-green-500');
                                 btn.innerHTML += '<i class="fas fa-check text-green-600 mt-1 mr-2"></i>';
                             } else if (idx === userAnswer && idx !== q.correctIndex) {
                                 btn.classList.add('bg-red-100', 'border-red-500');
                                  btn.innerHTML += '<i class="fas fa-times text-red-600 mt-1 mr-2"></i>';
                             } else {
                                 btn.classList.add('opacity-50');
                             }
                         } else {
                             // RDS Mode - just highlight selected
                             if (idx === userAnswer) {
                                 btn.classList.add('bg-blue-100', 'border-blue-500');
                             }
                         }
                    } else {
                        btn.onclick = () => app.handleAnswer(idx);
                    }

                    btn.innerHTML += `<span>${c}</span>`;
                    choicesDiv.appendChild(btn);
                });

                // Feedback (Standard Mode only)
                if (isAnswered && session.mode === 'standard') {
                    feedbackDiv.classList.remove('hidden');
                    let feedbackHtml = '';
                    if (userAnswer === q.correctIndex) {
                        feedbackDiv.classList.add('bg-green-100', 'text-green-800');
                        feedbackHtml = '<strong>Correct!</strong> Good job.';
                    } else {
                        feedbackDiv.classList.add('bg-red-100', 'text-red-800');
                        feedbackHtml = `<strong>Incorrect.</strong> The correct answer is: ${q.choices[q.correctIndex]}`;
                    }

                    // Append AI Explain Button
                    feedbackHtml += `
                        <div class="mt-3 border-t pt-3 border-opacity-20 border-black">
                            <button onclick="app.explainPracticeAnswer(this)" class="text-sm bg-white bg-opacity-50 text-purple-700 hover:bg-opacity-80 px-3 py-1 rounded font-bold shadow-sm transition">✨ AI Explain</button>
                            <div id="p-ai-explanation" class="mt-3 hidden bg-white bg-opacity-70 p-3 rounded text-sm text-gray-800 font-medium"></div>
                        </div>
                    `;
                    feedbackDiv.innerHTML = feedbackHtml;
                }

                // Navigation Button Logic
                const btnNext = document.getElementById('btn-next');
                const btnSubmit = document.getElementById('btn-submit-exam');
                const isLast = session.currentIndex === session.questions.length - 1;
                
                // Use inline styles to guarantee visibility changes
                if (isLast) {
                    btnNext.style.display = 'none';
                    btnSubmit.style.display = 'block';
                    btnSubmit.classList.remove('hidden'); // Tailwind backup
                    btnSubmit.innerText = session.mode === 'rds' ? 'Submit Exam' : 'Finish Practice';
                    btnSubmit.onclick = () => app.submitExam();
                } else {
                    btnNext.style.display = 'block';
                    btnNext.classList.remove('hidden'); // Tailwind backup
                    btnSubmit.style.display = 'none';
                    btnNext.innerText = 'Next';
                }
            },

            handleAnswer(choiceIndex) {
                const session = this.data.practiceSession;
                session.answers[session.currentIndex] = choiceIndex;
                
                if (session.mode === 'standard') {
                    if (choiceIndex === session.questions[session.currentIndex].correctIndex) {
                        session.score++;
                    }
                }
                
                this.saveSession(); // Auto-save progress
                this.renderPractice();
            },

            nextQuestion() {
                const session = this.data.practiceSession;
                if (session.currentIndex < session.questions.length - 1) {
                    session.currentIndex++;
                    this.saveSession(); // Auto-save progress
                    this.renderPractice();
                }
            },

            prevQuestion() {
                 const session = this.data.practiceSession;
                if (session.currentIndex > 0) {
                    session.currentIndex--;
                    this.saveSession(); // Auto-save progress
                    this.renderPractice();
                }
            },
            
            toggleQuickEdit() {
                const container = document.getElementById('p-quick-edit-container');
                if (!container) return;
                
                if (container.classList.contains('hidden')) {
                    const session = this.data.practiceSession;
                    const q = session.questions[session.currentIndex];
                    
                    document.getElementById('qe-text').value = q.text;
                    const choicesContainer = document.getElementById('qe-choices-container');
                    choicesContainer.innerHTML = '';
                    
                    q.choices.forEach((c, cIdx) => {
                        choicesContainer.innerHTML += `
                            <div class="flex items-center space-x-2">
                                <input type="radio" name="qe-correct" value="${cIdx}" ${cIdx === q.correctIndex ? 'checked' : ''}>
                                <input type="text" id="qe-choice-${cIdx}" value="${c.replace(/"/g, '&quot;')}" class="flex-1 border rounded px-2 py-1 text-sm">
                            </div>
                        `;
                    });
                    container.classList.remove('hidden');
                } else {
                    container.classList.add('hidden');
                }
            },

            saveQuickEdit() {
                const session = this.data.practiceSession;
                const q = session.questions[session.currentIndex];
                
                // 1. Gather updated data
                const newText = document.getElementById('qe-text').value;
                const newChoices = [];
                let newCorrectIndex = 0;
                
                q.choices.forEach((_, cIdx) => {
                    newChoices.push(document.getElementById(`qe-choice-${cIdx}`).value);
                    const radio = document.querySelector(`input[name="qe-correct"][value="${cIdx}"]`);
                    if (radio && radio.checked) {
                        newCorrectIndex = cIdx;
                    }
                });
                
                // 2. Update Practice Session Question
                q.text = newText;
                q.choices = newChoices;
                q.correctIndex = newCorrectIndex;
                
                // 3. Update Master Bank
                const masterBank = this.data.banks.find(b => b.name === session.bankName);
                if (masterBank) {
                    const masterQIndex = masterBank.questions.findIndex(mq => mq.id === q.id);
                    if (masterQIndex > -1) {
                        masterBank.questions[masterQIndex].text = newText;
                        masterBank.questions[masterQIndex].choices = newChoices;
                        masterBank.questions[masterQIndex].correctIndex = newCorrectIndex;
                    }
                    masterBank.date = new Date().toISOString(); // Update timestamp
                }
                
                // 4. Save
                this.saveBanks();
                this.saveSession();
                
                // 5. Close and Re-render
                this.toggleQuickEdit();
                this.renderPractice();
            },
            
            submitExam() {
                const session = this.data.practiceSession;
                // Calculate score
                session.score = 0;
                session.questions.forEach((q, idx) => {
                    if (session.answers[idx] === q.correctIndex) {
                        session.score++;
                    }
                });
                
                this.finishPractice();
            },
            
            finishPractice() {
                const session = this.data.practiceSession;
                // Since they finished, delete the saved session so "Resume" no longer shows
                localStorage.removeItem('mcq_practice_session');
                
                const container = document.getElementById('app-container');
                const template = document.getElementById('view-result');
                
                if (!template) return alert("Error: Template missing");
                
                container.innerHTML = '';
                container.appendChild(template.content.cloneNode(true));
                
                // Score Header
                const percentage = Math.round((session.score / session.questions.length) * 100) || 0;
                const scoreEl = document.getElementById('result-score');
                const detailEl = document.getElementById('result-detail');
                
                if(scoreEl) {
                    scoreEl.innerText = `${percentage}%`;
                    scoreEl.className = `text-6xl font-bold my-6 ${percentage < 50 ? 'text-red-600' : (percentage > 80 ? 'text-green-600' : 'text-blue-600')}`;
                }
                if(detailEl) detailEl.innerText = `You got ${session.score} out of ${session.questions.length} correct.`;
                
                // Wrong Answers
                const list = document.getElementById('result-wrong-list');
                const section = document.getElementById('wrong-answers-section');
                
                if (!list || !section) return; 
                
                let wrongCount = 0;
                session.questions.forEach((q, idx) => {
                    const userAnswer = session.answers[idx];
                    // Strict comparison for wrong answer
                    if (userAnswer !== q.correctIndex) {
                        wrongCount++;
                        const item = document.createElement('div');
                        item.className = 'bg-white border-l-4 border-red-500 shadow-sm p-4 rounded mb-4';
                        
                        let userText = '<span class="text-gray-400 italic">No Answer</span>';
                        if (userAnswer !== undefined && userAnswer !== null && q.choices[userAnswer]) {
                            userText = q.choices[userAnswer];
                        }
                        
                        const correctText = q.choices[q.correctIndex] || '<span class="text-gray-400 italic">Unknown</span>';
                        
                        item.innerHTML = `
                            <div class="mb-2 font-medium text-gray-800"><span class="text-red-500 font-bold">Q${idx+1}.</span> ${q.text}</div>
                            ${q.image ? `<img src="${q.image}" class="h-24 mb-2 object-contain border">` : ''}
                            <div class="grid grid-cols-1 gap-2 text-sm mb-3">
                                <div class="bg-red-50 p-2 rounded text-red-800"><i class="fas fa-times-circle mr-2"></i>You chose: <strong>${userText}</strong></div>
                                <div class="bg-green-50 p-2 rounded text-green-800"><i class="fas fa-check-circle mr-2"></i>Correct answer: <strong>${correctText}</strong></div>
                            </div>
                            <button onclick="app.explainResultAnswer(${idx}, this)" class="text-xs bg-purple-100 text-purple-700 hover:bg-purple-200 px-3 py-1 rounded-full font-bold transition"><i class="fas fa-sparkles mr-1"></i> AI Explain</button>
                            <div class="ai-explanation mt-3 hidden bg-purple-50 p-3 rounded text-sm text-purple-900 border border-purple-200"></div>
                        `;
                        list.appendChild(item);
                    }
                });
                
                if (wrongCount === 0) {
                    section.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative text-center" role="alert">
                            <strong class="font-bold">Perfect!</strong>
                            <span class="block sm:inline">You got everything right. Amazing!</span>
                        </div>`;
                }
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
